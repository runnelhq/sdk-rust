[package]
name = "runnel-plugin"
version = "0.2.0"
description = "SDK for Runnel plugins: JSON-RPC over stdin/stdout, schemas from Rust types, transforms as streams"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["runnel", "plugin", "workflow", "etl"]
categories = ["development-tools"]
# Not on crates.io yet (only after agreement with the maintainer).
publish = false

[workspace]
members = ["derive", "examples/hello"]

[workspace.package]
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/runnelhq/sdk-rust"

[dependencies]
runnel-plugin-derive = { path = "derive", version = "=0.2.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
