[package]
name = "runnel-plugin-derive"
version = "0.2.0"
description = "Derive macro Config of runnel-plugin: JSON Schema of a configuration from a Rust struct"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "=1.0.107"
quote = "=1.0.47"
syn = { version = "=2.0.119", features = ["full"] }
